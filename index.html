<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google के साथ साइन इन करें</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* पूरे पेज का लेआउट और बैकग्राउंड */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff; /* बैकग्राउंड को सफेद रखा गया है */
            font-family: 'Roboto', arial, sans-serif;
        }

        /* लॉगिन बॉक्स का डिजाइन (Realistic Card) */
        .login-card {
            width: 380px;
            padding: 40px;
            border: 1px solid #dadce0; /* हल्का ग्रे बॉर्डर जैसा गूगल इस्तेमाल करता है */
            border-radius: 8px;
            text-align: center;
        }

        /* गूगल का रंगीन लोगो */
        .google-logo {
            width: 75px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
            color: #202124;
        }

        p {
            font-size: 16px;
            color: #202124;
            margin-bottom: 30px;
        }

        /* लॉगिन बटन को बीच में रखने के लिए */
        .button-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google" class="google-logo">
        
        <h1>साइन इन करें</h1>
        <p>जारी रखने के लिए अपने Google खाते का उपयोग करें</p>

        <div class="button-wrapper">
            <div id="g_id_onload"
                 data-client_id="737052635921-56jh2b761dsmuku3qt3h8rnd0ot84got.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="onSuccess"
                 data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="pill" 
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
            </div>
    </div>

    <script>
        // लॉगिन सफल होने के बाद क्या होगा
        function onSuccess(response) {
            console.log("सफलतापूर्वक लॉगिन हो गया है!");
            // यह लाइन यूजर को आपके डैशबोर्ड पेज पर भेज देगी
            // सुनिश्चित करें कि आपकी दूसरी फाइल का नाम dashboard.html ही हो
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
