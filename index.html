<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UtkForce AI Chatbot</title>
    <style>
        /* CSS Styling: Modern Dark Theme */
        :root {
            --bg: #071028;
            --card: #0b1220;
            --muted: #94a3b8;
            --accent: #00d4ff;
            --glass: rgba(255, 255, 255, 0.03);
            --ai-color: #00d4ff;
            --user-color: #6366f1;
        }
        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: linear-gradient(180deg, var(--bg) 0%, #061126 100%);
            color: #e6eef8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 720px;
            background: var(--card);
            border-radius: 14px;
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.5);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #chatWindow {
            height: 60vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.1);
        }
        .message {
            display: flex;
            margin-bottom: 15px;
        }
        .user .bubble {
            background-color: var(--user-color);
            color: white;
            border-radius: 15px 15px 0 15px;
            margin-left: auto;
            text-align: right;
        }
        .ai .bubble {
            background-color: var(--ai-color);
            color: #002;
            border-radius: 15px 15px 15px 0;
            margin-right: auto;
        }
        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message-image {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #inputArea {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        #promptInput {
            flex-grow: 1;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: inherit;
            font-size: 15px;
            outline: none;
            min-height: 48px;
            resize: none;
            line-height: 1.5;
            box-sizing: border-box;
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: background 0.2s;
        }
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        #sendBtn {
            background: var(--accent);
            color: #002;
            border-radius: 50%;
        }
        #sendBtn:disabled {
            background: var(--muted);
            cursor: not-allowed;
        }
        #imagePreviewContainer {
            margin-top: 10px;
            display: none;
            padding: 10px;
            border: 1px dashed var(--muted);
            border-radius: 8px;
            align-items: center;
            gap: 10px;
            max-width: 250px;
        }
        #imagePreview {
            max-width: 100px;
            max-height: 100px;
            border-radius: 6px;
        }
        #removeImageBtn {
            font-size: 12px;
            padding: 5px 10px;
            height: auto;
            width: auto;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            border-radius: 5px;
        }
        .loading-dot {
            height: 10px;
            width: 10px;
            background-color: var(--ai-color);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
            margin: 0 2px;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .footer-text {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>UtkForce AI</h1>
        <div id="chatWindow">
            <div class="message ai">
                <div class="bubble">नमस्ते, मैं UtkForce AI हूँ। मैं आपकी कैसे मदद कर सकता हूँ?</div>
            </div>
        </div>

        <div id="imagePreviewContainer">
            <img id="imagePreview" alt="Attached Image">
            <button id="removeImageBtn">हटाएँ</button>
        </div>

        <div id="inputArea">
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            
            <button class="icon-btn" id="attachImageBtn" title="चित्र संलग्न करें">🖼️</button>
            <textarea id="promptInput" placeholder="अपना सवाल यहाँ लिखें..." rows="1"></textarea>
            <button class="icon-btn" id="sendBtn" disabled title="भेजें">➤</button>
        </div>
        <div class="footer-text">
            Developed by Utkarsh Maurya - Secure Backend via Render.
        </div>
    </div>

<script>
(function(){
    // --- Backend API Endpoint (इसे Render deployment के बाद बदलना होगा) ---
    const API_ENDPOINT = 'https://utkforceai-backend.onrender.com'; 

    // --- DOM Elements ---
    const chatWindow = document.getElementById('chatWindow');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const attachImageBtn = document.getElementById('attachImageBtn');
    const imageInput = document.getElementById('imageInput');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const removeImageBtn = document.getElementById('removeImageBtn');

    let isLoading = false;
    let attachedImage = null; // Stores { base64: string, mimeType: string }

    // --- Helper Functions ---

    function setLoading(loading) {
        isLoading = loading;
        promptInput.disabled = loading;
        sendBtn.disabled = loading || promptInput.value.trim() === '';
        attachImageBtn.disabled = loading;
    }

    function createMessageBubble(text, sender, isImage = false, imageSource = null) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}`;

        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'bubble';
        
        // Handle markdown (basic)
        const formattedText = text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
            .replace(/`(.*?)`/g, '<code>$1</code>'); // Inline Code
            
        bubbleDiv.innerHTML = formattedText; // Use innerHTML to parse basic formatting
        
        if (isImage && imageSource) {
            const img = document.createElement('img');
            img.src = imageSource;
            img.className = 'message-image';
            bubbleDiv.prepend(img);
        }

        messageDiv.appendChild(bubbleDiv);
        chatWindow.appendChild(messageDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function displayError(message) {
        createMessageBubble(`❌ त्रुटि: ${message}`, 'ai');
    }

    // --- Image Handling ---

    attachImageBtn.addEventListener('click', () => {
        imageInput.click();
    });

    imageInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const base64String = e.target.result.split(',')[1];
                imagePreview.src = e.target.result;
                imagePreviewContainer.style.display = 'flex';
                attachedImage = {
                    base64: base64String,
                    mimeType: file.type
                };
                promptInput.focus();
                sendBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }
    });

    removeImageBtn.addEventListener('click', () => {
        imagePreviewContainer.style.display = 'none';
        imagePreview.src = '';
        imageInput.value = '';
        attachedImage = null;
        if (!promptInput.value.trim()) {
             sendBtn.disabled = true;
        }
    });

    // --- Core Response Logic ---

    async function generateResponse() {
        if (isLoading) return;

        const userQuery = promptInput.value.trim();
        if (!userQuery && !attachedImage) return;

        // 1. यूज़र का मैसेज डिस्प्ले करें
        let displayedQuery = userQuery;
        let imageSource = null;
        if (attachedImage) {
            displayedQuery = userQuery ? `${userQuery}\n\n[संलग्न चित्र]` : `[संलग्न चित्र]`;
            imageSource = imagePreview.src;
        }
        createMessageBubble(displayedQuery, 'user', !!attachedImage, imageSource);
        
        // इनपुट फील्ड साफ़ करें और इमेज हटाएँ
        promptInput.value = '';
        removeImageBtn.click(); 
        
        setLoading(true);

        // AI लोडिंग बबल
        const loadingBubble = document.createElement('div');
        loadingBubble.className = 'message ai';
        loadingBubble.innerHTML = `<div class="bubble"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>`;
        chatWindow.appendChild(loadingBubble);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        
        try {
            const payload = {
                userQuery: userQuery,
                base64Image: attachedImage ? attachedImage.base64 : null,
                mimeType: attachedImage ? attachedImage.mimeType : null
            };
            
            // 2. सुरक्षित Python Backend API को कॉल करें
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorBody = await response.json();
                throw new Error(errorBody.detail || `अनुरोध विफल हुआ: ${response.statusText}`);
            }

            const result = await response.json();
            const aiResponseText = result.response || "AI जवाब जेनरेट करने में विफल रहा।";
            
            // लोडिंग बबल को हटाएँ
            chatWindow.removeChild(loadingBubble);

            // AI जवाब डिस्प्ले करें
            createMessageBubble(aiResponseText, 'ai');

        } catch (error) {
            console.error("Backend/API error:", error);
            // लोडिंग बबल को हटाएँ और एरर दिखाएँ
            chatWindow.removeChild(loadingBubble);
            displayError(`अनुरोध विफल हुआ। क्या Backend Live है? Error: ${error.message}`);
        } finally {
            setLoading(false);
        }
    }

    // --- Event Listeners ---

    promptInput.addEventListener('input', () => {
        const query = promptInput.value.trim();
        sendBtn.disabled = !(query || attachedImage);
        
        // Textarea height adjustment
        promptInput.style.height = 'auto';
        promptInput.style.height = promptInput.scrollHeight + 'px';
    });

    sendBtn.addEventListener('click', generateResponse);

    // Enter Key to Send
    promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            generateResponse();
        }
    });

})();
</script>
</body>
</html>
