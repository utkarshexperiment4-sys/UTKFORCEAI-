<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google के साथ साइन इन करें</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff;
            font-family: 'Roboto', arial, sans-serif;
        }

        .login-card {
            width: 380px;
            padding: 40px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            text-align: center;
        }

        .google-logo {
            width: 75px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
            color: #202124;
        }

        p {
            font-size: 16px;
            color: #202124;
            margin-bottom: 30px;
        }

        .button-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google" class="google-logo">
        
        <h1>साइन इन करें</h1>
        <p>UTKFORCE AI में जारी रखने के लिए</p>

        <div class="button-wrapper">
            <div id="g_id_onload"
                 data-client_id="737052635921-bp8v3l6vt6u0ktp7ugbo38odiasc4u5a.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="onSuccess"
                 data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="pill" 
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <script>
        function onSuccess(response) {
            console.log("सफलतापूर्वक लॉगिन हो गया है!");
            
            // सुरक्षा के लिए 'isLoggedIn' सेट करना (बहुत जरूरी)
            // इससे ब्राउज़र को पता चलेगा कि यूजर लॉगिन कर चुका है
            sessionStorage.setItem("isLoggedIn", "true");

            // अब यूजर को डैशबोर्ड पर भेजें
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
