<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UTK AI Demo — Local Test</title>
  <style>
    :root{ --bg:#0f1724; --card:#0b1220; --muted:#94a3b8; --accent:#00d4ff; --glass: rgba(255,255,255,0.03) }
    body{ margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: linear-gradient(180deg,#071028 0%, #061126 100%); color:#e6eef8; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px;}
    .card{ width:100%; max-width:920px; background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02)); border-radius:14px; padding:22px; box-shadow: 0 6px 30px rgba(2,6,23,0.6); border:1px solid rgba(255,255,255,0.03); }
    h1{ margin:0 0 6px 0; font-size:20px; letter-spacing:0.2px; }
    p.lead{ margin:0 0 16px 0; color:var(--muted); font-size:13px; }
    .row{ display:flex; gap:12px; align-items:center; margin-bottom:12px; }
    input[type="text"], textarea, select{ width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.04); background: rgba(255,255,255,0.02); color:inherit; font-size:14px; outline:none; }
    textarea{ min-height:110px; resize:vertical; }
    .controls{ display:flex; gap:10px; }
    button{ background:linear-gradient(90deg,var(--accent), #00ffa3); color:#002; border:none; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:600; box-shadow: 0 6px 20px rgba(0,212,255,0.08); }
    button.ghost{ background:transparent; color:var(--muted); border:1px solid rgba(255,255,255,0.04); box-shadow:none; }
    .responseBox{ margin-top:14px; background:var(--glass); padding:14px; border-radius:10px; min-height:140px; color:#dbeafe; font-size:14px; white-space:pre-wrap; overflow:auto; border:1px solid rgba(255,255,255,0.02); }
    .meta{ font-size:12px; color:var(--muted); margin-top:8px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .badge{ padding:6px 8px; background:rgba(255,255,255,0.02); border-radius:8px; font-size:12px; color:var(--muted); }
    .small{ font-size:13px; color:var(--muted); }
    .modeSelect{ width:170px; }
    .topRow{ display:flex; gap:12px; align-items:center; margin-bottom:12px; }
    @media(max-width:720px){ .topRow{ flex-direction:column; align-items:stretch } .modeSelect{ width:100% } }
  </style>
</head>
<body>
  <div class="card">
    <h1>UTK AI Demo — Local Test</h1>
    <p class="lead">इसी UI से बाद में backend जोड़कर ChatGPT + Blackbox दोनों से response लाकर merge कर पाएँगे। अभी यह demo random realistic replies दिखाता है।</p>

    <div class="topRow">
      <input id="promptInput" type="text" placeholder="अपने सवाल/प्रॉम्प्ट यहाँ लिखो — उदाहरण: 'एक सरल Python chatbot बनाओ'">
      <select id="mode" class="modeSelect">
        <option value="chatgpt">ChatGPT Mode (explain)</option>
        <option value="blackbox">Blackbox Mode (code)</option>
        <option value="combined" selected>Combined Mode</option>
      </select>
      <div style="display:flex; gap:8px;">
        <button id="askBtn">Ask</button>
        <button id="clearBtn" class="ghost">Clear</button>
      </div>
    </div>

    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <textarea id="promptArea" placeholder="या यहाँ लंबा प्रॉम्प्ट लिखो... (optional)"></textarea>
      <div style="width:260px; min-width:240px;">
        <div style="margin-bottom:10px;">
          <label class="small">Random seed?</label>
          <input id="seed" type="text" placeholder="Optional number or text">
        </div>
        <div style="display:flex; gap:8px; margin-bottom:8px;">
          <button id="typingBtn" class="ghost">Typing Effect: ON</button>
          <button id="copyBtn" class="ghost">Copy Reply</button>
        </div>
        <div class="meta">
          <div class="badge" id="status">Status: Idle</div>
          <div class="small">Local Demo</div>
        </div>
      </div>
    </div>

    <div class="responseBox" id="responseBox">AI response will appear here...</div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:12px; flex-wrap:wrap;">
      <div class="small">Demo for testing. Backend later: <strong>/api/ask</strong></div>
      <div class="small">Developed for: Utkarsh</div>
    </div>
  </div>

<script>
(function(){
  const chatReplies = [
    "यह एक अच्छा सवाल है। पहले हम समस्या को छोटे हिस्सों में बाँटते हैं।",
    "सटीक समाधान के लिए मुझे थोड़ा context दो: यह किस environment में चलेगा?",
    "Algorithm idea: input → preprocess → model → postprocess. इसे step-by-step implement करें।",
    "Short explanation: यह function user-input लेंगा, validation करेगा और फिर output देगा।",
    "Performance tip: loops के बजाय vectorized operations उपयोग करो जहाँ संभव हो।",
    "Ready: मैं code + comments दे सकता हूँ। बताओ किस language में चाहिए।"
  ];

  const blackReplies = [
    "```python\n# Example: simple HTTP server\nfrom http.server import SimpleHTTPRequestHandler, HTTPServer\n\nclass Handler(SimpleHTTPRequestHandler):\n    pass\n\nHTTPServer(('0.0.0.0', 8080), Handler).serve_forever()\n```",
    "```js\n// Example: throttle function\nfunction throttle(fn, wait){\n  let last=0; return function(...args){\n    const now = Date.now();\n    if(now - last >= wait){ last = now; fn.apply(this,args); }\n  }\n}\n```",
    "```bash\n# Run tests\npytest -q tests/\n```",
    "def compute(x):\n    # simple optimized loop\n    s = 0\n    for i in range(len(x)):\n        s += x[i]\n    return s",
    "# Tip: add unit tests and linting (flake8 / eslint) before merging to main"
  ];

  const combinedReplies = [
    "Blackbox ने code दिया और ChatGPT ने line-by-line explanation दी। नीचे code देखो और explanation के लिए 'Explain' दबाओ।",
    "Recommended: use the Python snippet (safe) and test in sandbox. Explanation: इस function में input validated है और errors handled हैं।",
    "Merged result: Code + Short guide.\n\nSteps:\n1) Copy code\n2) Run tests\n3) Optimize if needed"
  ];

  const statusEl = document.getElementById('status');
  const responseBox = document.getElementById('responseBox');
  const promptInput = document.getElementById('promptInput');
  const promptArea = document.getElementById('promptArea');
  const modeEl = document.getElementById('mode');
  const askBtn = document.getElementById('askBtn');
  const clearBtn = document.getElementById('clearBtn');
  const copyBtn = document.getElementById('copyBtn');
  const typingBtn = document.getElementById('typingBtn');
  let typingOn = true;

  typingBtn.addEventListener('click', ()=> {
    typingOn = !typingOn;
    typingBtn.innerText = 'Typing Effect: ' + (typingOn ? 'ON' : 'OFF');
  });

  function seedRandom(seed){
    // simple seeded random for reproducibility
    let h = 2166136261 >>> 0;
    for(let i=0;i<seed.length;i++){
      h = Math.imul(h ^ seed.charCodeAt(i), 16777619);
    }
    return function(){ h += 0x6D2B79F5; let t = Math.imul(h ^ (h >>> 15), 1 | h); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  function chooseRandom(arr, seedFunc){
    if(seedFunc){
      const idx = Math.floor(seedFunc() * arr.length);
      return arr[idx];
    }
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function typeWrite(text, el, cb){
    el.innerText = "";
    if(!typingOn){ el.innerText = text; if(cb) cb(); return; }
    let i = 0;
    const speed = 18; // ms per char
    const timer = setInterval(()=> {
      i++;
      el.innerText = text.substring(0,i);
      if(i >= text.length){
        clearInterval(timer);
        if(cb) cb();
      }
    }, speed);
  }

  askBtn.addEventListener('click', ()=> {
    const prompt = (promptArea.value || promptInput.value || "").trim();
    if(!prompt){
      responseBox.innerText = "कृपया prompt डालें।";
      return;
    }
    const seedText = document.getElementById('seed').value || "";
    const seedFunc = seedText ? seedRandom(seedText) : null;
    const mode = modeEl.value;

    statusEl.innerText = "Status: Thinking...";
    const start = Date.now();

    // simulate network + model time
    setTimeout(()=> {
      let reply = "";
      if(mode === 'chatgpt'){
        reply = chooseRandom(chatReplies, seedFunc);
      } else if(mode === 'blackbox'){
        reply = chooseRandom(blackReplies, seedFunc);
      } else {
        // combined: mix
        const b = chooseRandom(blackReplies, seedFunc);
        const c = chooseRandom(combinedReplies, seedFunc);
        const e = chooseRandom(chatReplies, seedFunc);
        reply = c + "\n\n---\n" + b + "\n\nExplanation:\n" + e;
      }

      typeWrite("🟦 Input: " + prompt + "\n\n🟩 AI Reply:\n" + reply, responseBox, ()=>{
        const dt = (Date.now()-start);
        statusEl.innerText = "Status: Ready • " + dt + "ms";
      });

    }, 600 + Math.floor(Math.random()*700));
  });

  clearBtn.addEventListener('click', ()=> {
    promptInput.value = "";
    promptArea.value = "";
    responseBox.innerText = "AI response will appear here...";
    statusEl.innerText = "Status: Idle";
  });

  copyBtn.addEventListener('click', ()=> {
    const text = responseBox.innerText;
    navigator.clipboard.writeText(text).then(()=> {
      statusEl.innerText = "Status: Copied to clipboard";
      setTimeout(()=> statusEl.innerText = "Status: Ready", 1100);
    }).catch(()=> {
      statusEl.innerText = "Status: Copy failed";
    });
  });

  // allow enter to ask
  promptInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ askBtn.click(); e.preventDefault(); }
  });

})();
</script>
</body>
</html>
